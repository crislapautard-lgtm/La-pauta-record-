
name: Crear La Pauta Capture

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Verificar módulos
        shell: pwsh
        run: |
          python -c "import numpy, cv2, mss, sounddevice, soundfile, soundcard; print('MODULOS CORRECTOS')"

      - name: Descargar FFmpeg
        shell: pwsh
        run: |
          Invoke-WebRequest `
            -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" `
            -OutFile ffmpeg.zip

          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_temp

          $ffmpeg = Get-ChildItem -Path ffmpeg_temp -Filter ffmpeg.exe -Recurse |
            Select-Object -First 1

          if (-not $ffmpeg) {
            throw "ERROR: No se encontró ffmpeg.exe"
          }

          Copy-Item $ffmpeg.FullName -Destination ffmpeg.exe

          if (-not (Test-Path "ffmpeg.exe")) {
            throw "ERROR: No se pudo copiar FFmpeg"
          }

      - name: Crear EXE La Pauta Capture
        shell: pwsh
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --onefile `
            --noconsole `
            --name LaPautaCapture `
            --add-binary "ffmpeg.exe;." `
            --collect-all numpy `
            --collect-all cv2 `
            --collect-all mss `
            --collect-all sounddevice `
            --collect-all soundfile `
            --collect-all soundcard `
            --collect-all cffi `
            --hidden-import _cffi_backend `
            main.py

          if (-not (Test-Path "dist\LaPautaCapture.exe")) {
            throw "ERROR: PyInstaller no creó LaPautaCapture.exe"
          }

      - name: Instalar Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y

      - name: Crear instalador
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist

          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /O"dist" /F"LaPautaCaptureSetup" instalador.iss

          if ($LASTEXITCODE -ne 0) {
            throw "ERROR: Inno Setup no pudo crear el instalador"
          }

          if (-not (Test-Path "dist\LaPautaCaptureSetup.exe")) {
            throw "ERROR: No se encontró el instalador generado"
          }

      - name: Subir instalador a Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LaPautaCaptureSetup
          path: dist/LaPautaCaptureSetup.exe
          if-no-files-found: error
          retention-days: 14
          
