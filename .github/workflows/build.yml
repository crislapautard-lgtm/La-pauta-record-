
name: Crear La Pauta Capture

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verificar módulos
        run: |
          python -c "import numpy, cv2, mss, sounddevice, soundfile, cffi; print('TODOS LOS MODULOS CORRECTOS')"

      - name: Descargar FFmpeg
        shell: pwsh
        run: |
          Invoke-WebRequest `
            -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" `
            -OutFile ffmpeg.zip

          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_temp

          $ffmpeg = Get-ChildItem `
            -Path ffmpeg_temp `
            -Filter ffmpeg.exe `
            -Recurse |
            Select-Object -First 1

          if ($null -eq $ffmpeg) {
            throw "No se encontró ffmpeg.exe"
          }

          Copy-Item $ffmpeg.FullName -Destination ffmpeg.exe

      - name: Crear EXE
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name LaPautaCapture --add-binary "ffmpeg.exe;." --collect-all numpy --collect-all cv2 --collect-all mss --collect-all sounddevice --collect-all soundfile --collect-all cffi --hidden-import _cffi_backend main.py

      - name: Instalar Inno Setup
        run: choco install innosetup -y

      - name: Crear instalador
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" instalador.iss

      - name: Subir instalador
        uses: actions/upload-artifact@v4
        with:
          name: LaPautaCaptureSetup
          path: dist/LaPautaCaptureSetup.exe
