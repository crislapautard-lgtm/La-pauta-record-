
name: LaPauta Capture Studio Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Actualizar herramientas
        run: python -m pip install --upgrade pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Compilar programa
        run: >
          pyinstaller
          --noconfirm
          --clean
          --windowed
          --onefile
          --name LaPautaCaptureStudio
          --collect-all imageio_ffmpeg
          --collect-all soundcard
          --collect-all mss
          main.py

      - name: Instalar Inno Setup
        run: choco install innosetup -y

      - name: Crear instalador
        run: iscc Instalador.iss

      - name: Publicar archivos
        uses: actions/upload-artifact@v4
        with:
          name: LaPauta-Capture-Studio-Windows
          path: |
            dist/LaPautaCaptureStudio.exe
            installer/LaPautaCaptureStudio-Setup.exe
            
